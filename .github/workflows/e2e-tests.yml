name: E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: yasca_db
          POSTGRES_USER: yasca_user
          POSTGRES_PASSWORD: yasca_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Backend Dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Migrations and Seed Database
      env:
        DATABASE_URL: postgres://yasca_user:yasca_password@localhost:5432/yasca_db
      run: |
        cd backend
        python manage.py migrate_schemas --shared
        python manage.py migrate_schemas --tenant
        python create_ci_env.py

    - name: Start Django Backend
      env:
        DATABASE_URL: postgres://yasca_user:yasca_password@localhost:5432/yasca_db
      run: |
        cd backend
        python manage.py runserver 8000 &
      
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm ci

    - name: Install Playwright Browsers
      run: |
        cd frontend
        npx playwright install --with-deps chromium

    - name: Start Vite Frontend
      run: |
        cd frontend
        npm run dev &
      
    - name: Wait for services to be ready
      run: |
        # Wait for backend
        until curl -s http://localhost:8000/api/public/clinic-info/ > /dev/null; do
          echo "Waiting for backend..."
          sleep 2
        done
        # Wait for frontend
        until curl -s http://localhost:5173/ > /dev/null; do
          echo "Waiting for frontend..."
          sleep 2
        done

    - name: Run Playwright Tests
      run: |
        cd frontend
        npx playwright test --reporter=html

    - name: Upload Playwright Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: frontend/playwright-report/
        retention-days: 14
