name: Visual Regression

# Faz 9 — Sayfanın görsel parmak izini onaylı baseline ile karşılaştırır.
# Bir CSS/layout değişikliği görünümü bozarsa fonksiyonel testler patlamaz
# ama bu job patlar ve expected/actual/diff üçlüsünü artifact olarak yükler.
#
# BASELINE NOTU: __screenshots__ baseline'ları Linux'ta üretilip commit'lenir
# (font rendering OS'a bağlı). Yerelde (Windows) üretilen baseline CI'da patlar.
# İlk baseline'ı üretmek için bu workflow'u manuel tetikleyip 'update' modunda
# çalıştır veya CI üretip artifact'tan indirip commit'le.

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      update_baseline:
        description: 'Baseline görüntüleri yeniden üret (--update-snapshots)'
        type: boolean
        default: false

jobs:
  visual:
    name: Visual Regression (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run visual regression
        run: |
          if [ "${{ github.event.inputs.update_baseline }}" = "true" ]; then
            npm run test:visual:update
          else
            npm run test:visual
          fi

      - name: Upload visual report (diff'ler dahil)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-report
          path: |
            frontend/playwright-report-visual/
            frontend/e2e-visual/__screenshots__/
          retention-days: 14
