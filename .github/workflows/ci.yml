name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ─────────────────────────────────────────────
  # Backend: dual-mode pytest matrix (SQLite hızlı + PostgreSQL fidelity)
  # ─────────────────────────────────────────────
  backend:
    name: Backend Tests (${{ matrix.db-mode }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        db-mode: [sqlite, postgres]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
          POSTGRES_DB: yascadb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Postgres mode: gerçek tenant isolation tests aktif
      # SQLite mode: shim aktif, hızlı geri bildirim
      DATABASE_URL: ${{ matrix.db-mode == 'postgres' && 'postgresql://postgres:postgres123@localhost:5432/yascadb_test' || '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run django-tenants migrations (PostgreSQL only)
        if: matrix.db-mode == 'postgres'
        run: |
          python manage.py migrate_schemas --shared
          python manage.py migrate_schemas --tenant

      - name: Run tests with coverage
        run: pytest --cov=api --cov=customers --cov-config=.coveragerc --cov-report=xml --cov-fail-under=78

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend-${{ matrix.db-mode }}

  # ─────────────────────────────────────────────
  # Frontend: type-check + lint + vitest
  # ─────────────────────────────────────────────
  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint --max-warnings 0

      - name: Run unit tests with coverage (threshold gate'i vitest.config.ts içinde)
        run: npx vitest run --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: frontend/coverage/coverage-final.json
          flags: frontend

  # ─────────────────────────────────────────────
  # A11y: ayrı job — zero-tolerance gate (PR'a merge için required check)
  # ─────────────────────────────────────────────
  a11y:
    name: A11y Tests (WCAG 2.1 AA)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run a11y unit tests
        run: npx vitest run src/app/components/__a11y__
