name: Flaky Test Report

# Haftalık cron + manuel — testleri 5 kez retry ile çalıştır, flaky olanları raporla.
# Flaky test'ler 1 hafta içinde fix edilmezse @pytest.mark.skip ile karantinaya alınır.

on:
  schedule:
    - cron: '0 4 * * 1'   # Her Pazartesi 04:00 UTC
  workflow_dispatch:

jobs:
  detect-flaky-backend:
    name: Detect Flaky Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
          POSTGRES_DB: yascadb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres123@localhost:5432/yascadb_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install deps
        run: pip install -r requirements-dev.txt

      - name: Run django-tenants migrations
        run: |
          python manage.py migrate_schemas --shared
          python manage.py migrate_schemas --tenant

      - name: Run with reruns (flaky detection)
        continue-on-error: true
        run: |
          pytest --reruns 3 --reruns-delay 1 -v 2>&1 | tee test-output.log

      - name: Detect flaky tests
        run: |
          grep -E "RERUN|FLAKY|PASSED \(rerun" test-output.log > flaky.txt || true
          if [ -s flaky.txt ]; then
            echo "⚠️  Flaky testler tespit edildi:"
            cat flaky.txt
            echo "📌 Bu test'leri @pytest.mark.flaky ile işaretle ve GitHub issue aç."
          else
            echo "✅ Hiç flaky test yok."
          fi

      - name: Upload flaky report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-flaky-report
          path: backend/flaky.txt

  slow-test-budget:
    name: Slow Test Budget Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install deps
        run: pip install -r requirements-dev.txt

      - name: Run all tests with durations
        continue-on-error: true
        run: |
          pytest --durations=0 -q -m "not requires_postgres" 2>&1 | tee durations.log

      - name: Parse slow tests
        run: |
          cat durations.log | python scripts/find-slow-tests.py | tee slow-report.md

      - name: Upload slow report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slow-test-report
          path: backend/slow-report.md
