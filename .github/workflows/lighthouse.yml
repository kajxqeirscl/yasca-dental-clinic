name: Lighthouse CI

# Faz 9 — Performance Budget.
# Zamanla eklenen kod siteyi sessizce yavaşlatır. Bu job her PR'da Lighthouse
# çalıştırır; lighthouserc.json'daki bütçe ('error' assertion'ları) aşılırsa
# job FAIL olur ve yavaşlatan değişiklik bloke edilir.

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  lighthouse:
    name: Lighthouse CI (Performance Budget)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Lighthouse CI
        run: npm install --no-save @lhci/cli

      - name: Build
        run: npm run build

      - name: Run Lighthouse CI
        run: npx lhci autorun
