[pytest]
DJANGO_SETTINGS_MODULE = core.settings_test
python_files = test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
# Slow test budget tracking: en yavaş 20 testi her run'da göster.
# Lokal hızlı çalışma için: pytest -m "not slow"
addopts = -v --tb=short --durations=20 -m "not slow"
markers =
    requires_postgres: gerçek PostgreSQL + django-tenants schema'larını gerektirir. SQLite mode'da otomatik skip edilir (DATABASE_URL kontrolü). Aktif etmek için: docker compose -f docker-compose.test.yml up -d && DATABASE_URL=postgresql://postgres:postgres123@localhost:5433/yascadb_test pytest -m requires_postgres
    slow: 200ms+ süren testler. CI'da ayrı job'da çalıştırılır. Lokal hızlı geliştirme için addopts ile dışlanır.
    flaky: 3 retry'da geçen testler — issue açılmalı, 1 hafta içinde fix edilmezse silinir.
