[mutmut]
# Mutation testing config.
# Sadece kritik modülleri mutate et (middleware, mixins, serializers, customer views).
# Bu dosyalar tenant isolation + audit logging + form validation içerir;
# mutation score düşükse business-critical bug'lar test'lerden kaçıyor demektir.

paths_to_mutate=api/middleware.py,api/mixins.py,api/serializers.py,customers/views.py

# Test komutu — mutant'ı kontrol etmek için pytest çalıştırılır.
# -x: ilk fail'de dur (hızlı feedback).
# --tb=no -q: minimal output.
# Sadece kritik test'leri çalıştır (yavaş E2E/integration'ı atla).
runner=pytest -x --tb=no -q api/tests/test_middleware.py api/tests/test_mixins.py api/tests/test_serializers.py customers/tests/test_register.py

# Mutation score raporu için:
#   mutmut run        — mutation testleri çalıştır
#   mutmut results    — özet rapor
#   mutmut html       — HTML rapor (html/index.html)
#   mutmut show N     — mutant #N'i göster

# Hedef mutation score (kritik dosyalar için):
#   api/middleware.py:  >=85%
#   api/serializers.py: >=80%
#   api/mixins.py:      >=75%
#   customers/views.py: >=80%
